[project]
name = "lesson-02-container"
version = "0.1.0"
description = "Sandboxing tutorial — lesson 2: the same nine attacks inside a hardened rootless container."
requires-python = ">=3.12"
# `pip` is needed only by Part 3's live re-run of the no-sandbox rung, which runs the suite as a
# native process in this venv — and attack 5 asks whether the environment can install a package. A
# `uv` venv ships without pip, and a missing tool must never be mistaken for a boundary.
dependencies = ["pip>=25"]

[tool.ruff]
# Lint/format policy comes from the repo-root ruff.toml (one place to change it). It must be pulled
# in explicitly: a leaf carrying [tool.ruff] SHADOWS the root rather than merging, so without this
# line the leaf silently runs ruff's own defaults. Count the dirs: leaf -> tutorial -> repo root.
extend = "../../ruff.toml"
# This lesson directory is its own source root, so the sibling scorecard.py sorts as a first-party
# import whether ruff runs here or from the repo root.
src = ["."]
