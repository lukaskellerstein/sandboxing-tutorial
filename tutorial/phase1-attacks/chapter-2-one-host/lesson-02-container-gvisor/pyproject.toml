[project]
name = "lesson-02-container-gvisor"
version = "0.1.0"
description = "Sandboxing tutorial — lesson 3: the same container, under gVisor (runsc)."
requires-python = ">=3.12"
# Empty on purpose: the lesson runs the same image twice under two runtimes and parses the JSON
# lines each prints. Everything it needs is the standard library; the attack suite is in the image.
dependencies = []

[tool.ruff]
# Lint/format policy comes from the repo-root ruff.toml (one place to change it). It must be pulled
# in explicitly: a leaf carrying [tool.ruff] SHADOWS the root rather than merging, so without this
# line the leaf silently runs ruff's own defaults. Count the dirs: leaf -> chapter -> phase -> tutorial -> repo root.
extend = "../../../../ruff.toml"
# This lesson directory is its own source root, so the sibling scorecard.py sorts as a first-party
# import whether ruff runs here or from the repo root.
src = ["."]
