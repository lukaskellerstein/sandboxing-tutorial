[project]
name = "lesson-06-compose-kata-openshell"
version = "0.1.0"
description = "Sandboxing tutorial — lesson 17: OpenShell composed over Kata, where the filesystem policy holds because the guest ships Landlock."
requires-python = ">=3.12"
# Empty on purpose. The lesson drives the openshell CLI, submits manifests as JSON through `kubectl`,
# and parses the JSON lines the sandbox prints — all standard library.
dependencies = []

[tool.ruff]
# Lint/format policy comes from the repo-root ruff.toml (one place to change it). It must be pulled
# in explicitly: a leaf carrying [tool.ruff] SHADOWS the root rather than merging, so without this
# line the leaf silently runs ruff's own defaults. Count the dirs: leaf -> chapter -> tutorial -> root.
extend = "../../../../ruff.toml"
# This lesson directory is its own source root, so the sibling scorecard.py and k8s.py sort as
# first-party imports whether ruff runs here or from the repo root.
src = ["."]
