# Lesson 5's policy — the whole lesson, in one file.
#
# Read it as a claim the run then tests. Everything not named here is DENIED, so the interesting
# part is how narrow the one hole is: not "network on", but *this binary*, to *this host and port*,
# using *these HTTP methods*.
#
# Applied with:  openshell policy set <sandbox> --policy policy.yaml --wait
# The --wait matters: the reload is what activates both the rules and the OCSF writer.

version: 1

# --- static: locked at sandbox create, never hot-reloaded ---------------------

filesystem_policy:
  include_workdir: true
  # /etc is read-only, which is what attack 3's backdoor and the `fs_policy_write` probe hit. The
  # probe writes to /etc/agent-probe-canary specifically because it is the path lesson 14 later
  # watches regress to ALLOWED when this policy is stacked on gVisor.
  read_only: [/usr, /lib, /bin, /sbin, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  # best_effort is the honest default and the trap at the same time. On a real kernel Landlock is
  # enforced; on gVisor's user-space kernel the syscall answers ENOSYS and enforcement silently
  # stops while the sandbox still reports healthy. `hard_requirement` is what makes that fail closed
  # instead — lesson 14 runs both and shows the difference.
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

# --- dynamic: hot-reloadable ---------------------------------------------------

network_policies:
  model_gateway:
    name: model-gateway-readonly
    endpoints:
      # The gateway the agent legitimately needs. Note what is NOT here: the collector on the very
      # next port. Same host, same protocol, one digit apart — nothing distinguishes them except
      # this list, which is exactly the distinction `--network none` cannot express.
      - host: host.openshell.internal
        port: 18410
        protocol: rest # L7: OpenShell parses HTTP, so rules can name methods
        enforcement: enforce # `audit` would record without blocking
        access: read-only # GET/HEAD/OPTIONS allowed; POST/PUT/PATCH/DELETE denied
    binaries:
      # Per-binary scoping. The `binary_scoped` probe copies THIS binary, byte for byte, to
      # /tmp/agent-probe-unlisted-curl and makes the identical request — and is denied, because the
      # policy names a path, not a program's behaviour. No kernel-level sandbox can see that.
      - { path: /usr/bin/curl }
