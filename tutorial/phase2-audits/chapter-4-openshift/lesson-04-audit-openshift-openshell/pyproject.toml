[project]
name = "lesson-04-audit-openshift-openshell"
version = "0.1.0"
description = "Sandboxing tutorial — lesson 2.4.4: auditing the OpenShell rung on OpenShift with OCSF, node auditd and the apiserver audit log."
requires-python = ">=3.12"
# Note the difference from chapters 1-3: this lesson runs on YOUR machine, not on the box, because
# the box is RHCOS — an immutable image with no package manager and nowhere to put a uv environment.
# So unlike lesson 9, where the openshell CLI was installed onto the box by a substrate script, here
# the CLI has to exist locally, and a Python dependency is the one way to get it that works the same
# on macOS and Linux without a .deb.
#
# PINNED, and the pin is not decoration. The CLI and the Helm chart are released on separate
# cadences: 0.0.101 is already current on PyPI while the chart this lesson installs is 0.0.99, and an
# alpha client talking to an older server fails in ways that have nothing to do with sandboxing.
# Whatever version is set here MUST match OPENSHELL_VERSION in infra/openshift-sno/openshell.sh.
dependencies = ["openshell==0.0.99"]

[tool.ruff]
# Lint/format policy comes from the repo-root ruff.toml (one place to change it). It must be pulled
# in explicitly: a leaf carrying [tool.ruff] SHADOWS the root rather than merging, so without this
# line the leaf silently runs ruff's own defaults. Count the dirs: leaf -> chapter -> phase -> tutorial -> repo root.
extend = "../../../../ruff.toml"
# This lesson directory is its own source root, so the sibling scorecard.py and openshift.py sort as
# first-party imports whether ruff runs here or from the repo root.
src = ["."]
