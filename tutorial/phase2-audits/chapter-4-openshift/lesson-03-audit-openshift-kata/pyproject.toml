[project]
name = "lesson-03-audit-openshift-kata"
version = "0.1.0"
description = "Sandboxing tutorial — lesson 2.4.3: auditing the Kata rung on OpenShift — the node sensor goes blind and the platform blocks the sidecar."
requires-python = ">=3.12"
