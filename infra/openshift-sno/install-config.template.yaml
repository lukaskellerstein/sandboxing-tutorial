# SNO install-config template. Fill the placeholders, then:
#   openshift-install --dir=cfg create single-node-ignition-config
# Placeholders:
#   __MACHINE_CIDR__  the node's real public subnet, e.g. 62.210.88.0/24 (from `ip -4 addr` in rescue/base)
#   __PULL_SECRET__   the Red Hat pull secret JSON, collapsed to ONE line
#   __SSH_PUBKEY__    a throwaway public key for the RHCOS `core` user
apiVersion: v1
baseDomain: spike.lab
metadata:
  name: sno
# Trim the payload to what chapter 4 actually uses. The full 4.18 payload is 906 manifests and ~34
# cluster operators converging on one 2012-era Xeon; the rollout is CPU-bound and this cluster
# deliberately ships without *.apps DNS, so Console could never work anyway. What stays, and why:
#   OperatorLifecycleManager  the kata stage installs the sandboxed-containers operator (a CSV)
#   marketplace               the redhat-operators CatalogSource its Subscription pulls from
#                             (the installer refuses marketplace without OperatorLifecycleManager)
#   Ingress                   not optional: the installer rejects a standalone cluster without it
# Everything else (Console, Insights, Storage, MachineAPI, ImageRegistry, samples, Build...) is
# dropped. hostPath PVs are core API and survive dropping Storage. A capability can be ENABLED on a
# live cluster later (oc patch clusterversion) but never disabled — so under-shooting is repairable
# without a reinstall, and over-shooting costs rollout minutes on every single build.
capabilities:
  baselineCapabilitySet: None
  additionalEnabledCapabilities:
    - OperatorLifecycleManager
    - marketplace
    - Ingress
compute:
  - name: worker
    replicas: 0
controlPlane:
  name: master
  replicas: 1
networking:
  networkType: OVNKubernetes
  clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23
  serviceNetwork:
    - 172.30.0.0/16
  machineNetwork:
    - cidr: __MACHINE_CIDR__
platform:
  none: {}
bootstrapInPlace:
  installationDisk: /dev/sda
pullSecret: '__PULL_SECRET__'
sshKey: '__SSH_PUBKEY__'
